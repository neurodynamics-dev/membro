<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#050807"> <!-- auditar: ok, theme-color exige valor literal -->
<meta name="robots" content="noindex,nofollow">
<title>O painel agora fica dentro do portal</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600&family=Instrument+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds/tokens.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(120% 90% at 72% -12%,var(--painel) 0%,var(--bg) 58%);
  color:var(--ink);font-family:var(--f);display:flex;align-items:center;justify-content:center;padding:28px;text-align:center}
.cx{max-width:430px}
.tag{font-family:var(--fd);font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  color:var(--syn);border:1px solid var(--syn-borda);border-radius:var(--r-tag);padding:4px 11px;display:inline-block}
h1{font-family:var(--fd);font-size:25px;font-weight:600;letter-spacing:-.02em;margin:20px 0 12px}
p{color:var(--muted);font-size:14.5px;line-height:1.7}
p.mini{color:var(--dim);font-size:12px;margin-top:20px}
a.btn{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 22px;border-radius:var(--r-sm);
  background:var(--syn);color:var(--cortex);font-family:var(--fd);font-weight:600;
  font-size:14px;text-decoration:none;margin-top:24px}
</style>
</head>
<body>
<div class="cx">
  <span class="tag">Mudou de lugar</span>
  <h1>O painel agora fica dentro do portal</h1>
  <p>Avisos, documentos, solicitações, ouvidoria, agendas, o site institucional e a
    auditoria estão em <b>Administração</b>, sem uma segunda tela de login.
    Estamos te levando para lá.</p>
  <a class="btn" href="./#/admin">Abrir Administração</a>
  <p class="mini">Atualize o favorito: o endereço é <b>/#/admin</b>.</p>
</div>
<script>setTimeout(function(){ location.replace('./#/admin'); }, 2200);</script>
</body>
</html>
