<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="O tour guiado do SOMA, o sistema da NeuroDynamics: crie a sua conta, veja o que é seu (tarefas, placar do LABBIO, agenda, treinamentos, Studio) e ponha o SOMA na tela do celular.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#050807"> <!-- auditar: ok, theme-color exige valor literal -->
<script>/* o tema escolhido no SOMA vale aqui também, antes de a página pintar */
try{ if (localStorage.getItem('nd.tema') === 'claro') document.documentElement.dataset.tema = 'claro'; }catch(e){}</script>
<title>Tour do SOMA | NeuroDynamics</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="SOMA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ds/tokens.css">
<style>
/* ============ TEMAS ============
   Tokens, papéis e tema vêm de ds/tokens.css (o mesmo do SOMA). Aqui só os
   nomes próprios desta página, ligados aos tokens do DS. */
:root{
  --r:18px; --max:1240px;
  --green:var(--axon); --teal:var(--ion-medium); --teal-rgb:91,191,176; --teal-tx:var(--ion-light);
  --roxo:var(--dendrito-primary); --bg-topo:var(--painel);
}
:root[data-tema="claro"]{
  --teal:var(--ion-dark); --teal-rgb:11,79,72; --teal-tx:var(--ion-dark);
  --roxo:var(--dendrito-dark); --bg-topo:var(--cortex-light);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--f);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.65;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100vh}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.015em;line-height:1.2}
a{color:inherit;text-decoration:none}
button{font-family:inherit;font-size:inherit;cursor:pointer;color:inherit;border:none;background:none}
button:disabled{opacity:.55;cursor:default}
input{font-family:inherit;font-size:16px;color:var(--ink);background:var(--campo);border:1px solid var(--line2);
  border-radius:11px;padding:11px 12px;outline:none;width:100%;transition:border-color .15s,background .15s}
input:focus{border-color:var(--syn-borda);background:rgba(var(--syn-rgb),.04)}
input::placeholder{color:var(--dim)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--syn-borda);flex-shrink:0}
img{max-width:100%}
[hidden]{display:none!important}
::selection{background:var(--syn);color:var(--deep)}
:focus-visible{outline:2px solid var(--foco);outline-offset:2px;border-radius:4px}
.ic{width:18px;height:18px;flex-shrink:0}
kbd{font-family:var(--fm);font-size:11.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;
  padding:1px 6px;background:rgba(var(--tom),.04);color:var(--ink);white-space:nowrap}
.mono{font-family:var(--fm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============ FUNDO ============ */
#bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:
  radial-gradient(120% 90% at 72% -12%, var(--bg-topo) 0%, var(--bg) 58%)}
#bg::after{content:'';position:absolute;inset:0;
  background-image:linear-gradient(rgba(var(--ink-rgb),.028) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(var(--ink-rgb),.028) 1px,transparent 1px);
  background-size:130px 130px;
  -webkit-mask-image:radial-gradient(85% 62% at 50% 26%, var(--void) 0%, transparent 100%);
          mask-image:radial-gradient(85% 62% at 50% 26%, var(--void) 0%, transparent 100%)}
.blob{position:absolute;border-radius:50%;filter:blur(120px);will-change:transform;opacity:.3}
.b1{width:56vmax;height:56vmax;left:-18vmax;top:-24vmax;
  background:radial-gradient(circle,var(--cortex-primary) 0%,rgba(0,89,79,0) 70%);animation:fl1 38s ease-in-out infinite alternate}
.b2{width:42vmax;height:42vmax;right:-16vmax;top:8vmax;opacity:.18;
  background:radial-gradient(circle,var(--cortex-primary) 0%,rgba(11,125,110,0) 70%);animation:fl2 32s ease-in-out infinite alternate}
.b3{width:30vmax;height:30vmax;left:36vw;bottom:-18vmax;opacity:.06;
  background:radial-gradient(circle,var(--cortex-accent) 0%,rgba(206,220,0,0) 70%);animation:fl3 44s ease-in-out infinite alternate}
[data-tema="claro"] .b1{opacity:.16} [data-tema="claro"] .b2{opacity:.12} [data-tema="claro"] .b3{opacity:.14}
@keyframes fl1{from{transform:translate(0,0) scale(1)}to{transform:translate(8vw,6vh) scale(1.14)}}
@keyframes fl2{from{transform:translate(0,0) scale(1.08)}to{transform:translate(-10vw,10vh) scale(.94)}}
@keyframes fl3{from{transform:translate(0,0) scale(1)}to{transform:translate(-7vw,-12vh) scale(1.2)}}
@media (prefers-reduced-motion:reduce){
  .blob{animation:none!important}
  *{scroll-behavior:auto!important;transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* ============ BOTÕES ============ (os mesmos da casca) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 20px;border-radius:11px;
  font-family:var(--fd);font-weight:600;font-size:13.5px;white-space:nowrap;
  transition:transform .15s, box-shadow .15s, background .15s, border-color .15s}
.btn .ic{width:16px;height:16px}
.btn.solid{background:var(--syn);color:var(--deep)}
.btn.solid:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(var(--syn-rgb),.22)}
.btn.claro{background:var(--ink);color:var(--bg)}
.btn.claro:hover{transform:translateY(-1px);box-shadow:0 8px 26px rgba(var(--ink-rgb),.14)}
.btn.ghost{border:1px solid var(--line2);color:var(--ink);background:rgba(var(--tom),.03)}
.btn.ghost:hover{background:rgba(var(--tom),.07);border-color:var(--dim)}
.btn.mini{height:34px;padding:0 13px;font-size:12.5px;border-radius:9px;gap:7px}
.btn.mini .ic{width:14px;height:14px}
.btn.largo{width:100%}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lk{color:var(--ink);border-bottom:1px solid var(--line2);transition:border-color .15s}
.lk:hover{border-color:var(--syn-borda)}

/* ============ CABEÇALHO ============ */
#hd{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--glass);
  backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.hd-in{max-width:var(--max);margin:0 auto;display:flex;align-items:center;gap:10px;height:60px;
  padding:0 max(18px, env(safe-area-inset-right)) 0 max(18px, env(safe-area-inset-left))}
.hd-marca{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.hd-marca img{height:17px;width:auto;display:block;filter:brightness(0) invert(1)}
[data-tema="claro"] .hd-marca img{filter:brightness(0) invert(.08)}
.hd-marca .simb{display:none;width:28px;height:28px;border-radius:8px}
.logotype{font-family:var(--fd);font-weight:700;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.hd-tag{font-family:var(--fd);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--syn-tx);
  border:1px solid rgba(var(--syn-rgb),.4);border-radius:var(--r-chip);padding:3px 9px;white-space:nowrap}
.hd-bt{height:38px;min-width:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:0 10px;color:var(--muted);border:1px solid var(--line);background:rgba(var(--tom),.03);font-size:13px;
  font-family:var(--fd);font-weight:600;white-space:nowrap}
.hd-bt:hover{color:var(--ink);border-color:var(--line2)}
.hd-bt .av{width:24px;height:24px;font-size:9.5px}
#hd-etapas{display:none}
#hd-etapas .n{font-family:var(--fm);font-size:11px;color:var(--syn-tx)}
.hd-prog{height:2px;background:var(--line)}
.hd-prog i{display:block;height:100%;width:0;background:var(--syn);transition:width .45s ease}
@media (max-width:900px){
  #hd-etapas{display:inline-flex}
  .hd-cta{display:none}
}
@media (max-width:560px){
  .hd-marca .logo-img, .hd-marca .logotype{display:none}
  .hd-marca .simb{display:block}
  #hd-conta .nm{display:none}
  .hd-in{gap:8px}
}

/* ============ LAYOUT ============ */
.tour{max-width:var(--max);margin:0 auto;display:grid;grid-template-columns:268px minmax(0,1fr);gap:56px;align-items:start;
  padding:calc(96px + env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) 90px max(24px, env(safe-area-inset-left))}
#trilho{position:sticky;top:calc(88px + env(safe-area-inset-top));max-height:calc(100vh - 110px);overflow:auto;
  padding:2px 4px 24px 2px;scrollbar-width:thin}
@media (max-width:900px){
  .tour{grid-template-columns:minmax(0,1fr);gap:0;
    padding:calc(80px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
  #trilho{display:none}
}

/* o trilho das etapas */
.tr-cab{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px 10px}
.tr-cab b{font-family:var(--fd);font-size:13px;letter-spacing:.02em}
.tr-cab span{font-family:var(--fm);font-size:11px;color:var(--dim)}
.tr-l{list-style:none;display:flex;flex-direction:column;gap:2px}
.tr-l a{display:flex;align-items:center;gap:12px;padding:7px 10px;border-radius:11px;color:var(--muted);font-size:13.5px;
  transition:background .15s,color .15s}
.tr-l a:hover{background:rgba(var(--tom),.05);color:var(--ink)}
.tr-l .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--fm);font-size:10.5px;
  border:1px solid var(--line2);flex-shrink:0;color:var(--dim);transition:background .2s,border-color .2s}
.tr-l .n .ic{width:13px;height:13px}
.tr-l a.vista .n{border-color:rgba(var(--ok-rgb),.45);color:var(--ok);background:rgba(var(--ok-rgb),.08)}
.tr-l a.on{background:rgba(var(--syn-rgb),.09);color:var(--ink);font-weight:600}
.tr-l a.on .n{background:rgba(var(--tom),.12);border-color:var(--ink);color:var(--ink);font-weight:600}

/* os primeiros passos (a missão) */
.missao{margin-top:22px;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--card)}
.missao h3{font-size:13.5px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.missao h3 span{font-family:var(--fm);font-size:11px;color:var(--dim);font-weight:400}
.ms-barra{height:4px;border-radius:3px;background:var(--line);margin:10px 0 12px;overflow:hidden}
.ms-barra i{display:block;height:100%;background:var(--syn);transition:width .5s}
.ms-l{list-style:none;display:flex;flex-direction:column;gap:4px}
.ms-l a{display:flex;gap:10px;align-items:center;font-size:12.8px;color:var(--muted);padding:4px 4px;border-radius:8px}
.ms-l a:hover{color:var(--ink);background:rgba(var(--tom),.04)}
.ms-l .b{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--line2);display:grid;place-items:center;flex-shrink:0}
.ms-l .b .ic{width:12px;height:12px}
.ms-l .feito a{color:var(--ink)}
.ms-l .feito .b{background:var(--ok);border-color:var(--ok);color:#06140E} /* auditar: ok, tom próprio do tour */
.ms-l .talvez .b{border-style:dashed}
.missao .ms-dica{font-size:12px;color:var(--dim);margin-top:10px;line-height:1.5}

/* ============ A ETAPA ============ */
.et{max-width:820px;min-width:0}
.eyebrow{display:inline-flex;align-items:center;gap:10px;font-family:var(--fd);font-size:11px;
  letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.eyebrow::before{content:'';width:7px;height:7px;background:var(--syn);flex-shrink:0}
.et h1{font-size:clamp(30px,4.8vw,50px);font-weight:600;letter-spacing:-.028em;line-height:1.04;margin:14px 0 16px}
.et h1:focus{outline:none}
.et h1 em{font-style:normal;background:linear-gradient(94deg,var(--syn) 10%,var(--cortex-medium) 90%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
[data-tema="claro"] .et h1 em{background:linear-gradient(94deg,#5B6600 10%,var(--cortex-primary) 90%);-webkit-background-clip:text;background-clip:text} /* auditar: ok, tom próprio do tour */
.lead{color:var(--muted);font-size:16.5px;max-width:690px;line-height:1.6}
.lead b{color:var(--ink);font-weight:600}
.bl{margin-top:40px}
.bl > h2{font-size:21px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bl > h2 .ic{width:20px;height:20px;color:var(--syn-tx)}
.bl > p, .bl .p{color:var(--muted);margin-bottom:12px;max-width:720px}
.bl p b, .bl li b, .nota b, .tile b{color:var(--ink);font-weight:600}
.sub-h{font-family:var(--fd);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px}

/* passo a passo numerado */
ol.passos{list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:14px;max-width:720px}
ol.passos > li{counter-increment:p;position:relative;padding-left:44px;color:var(--muted);min-height:28px}
ol.passos > li::before{content:counter(p);position:absolute;left:0;top:-2px;width:28px;height:28px;border-radius:50%;
  display:grid;place-items:center;font-family:var(--fm);font-size:12px;color:var(--syn-tx);
  border:1px solid rgba(var(--syn-rgb),.45);background:rgba(var(--syn-rgb),.07)}
ul.pontos{list-style:none;display:flex;flex-direction:column;gap:9px;max-width:720px}
ul.pontos > li{display:flex;gap:11px;color:var(--muted);align-items:baseline}
ul.pontos > li::before{content:'';width:6px;height:6px;background:var(--syn);flex-shrink:0;transform:translateY(-2px)}

/* recados */
.nota{border:1px solid var(--line);border-left:3px solid var(--info);border-radius:12px;padding:13px 16px;font-size:14px;
  color:var(--muted);background:rgba(var(--info-rgb),.05);max-width:720px}
.nota + .nota{margin-top:10px}
.nota.warn{border-left-color:var(--warn);background:rgba(var(--warn-rgb),.06)}
.nota.ok{border-left-color:var(--ok);background:rgba(var(--ok-rgb),.06)}
.nota.lima{border-left-color:var(--syn-borda);background:rgba(var(--syn-rgb),.05)}
.nota.bad{border-left-color:var(--bad);background:rgba(var(--bad-rgb),.06)}

/* ladrilhos */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:15px;padding:16px;background:var(--card);display:flex;flex-direction:column;gap:6px;
  transition:border-color .15s,background .15s,transform .15s;min-width:0}
a.tile:hover{border-color:var(--line2);background:rgba(var(--tom),.05);transform:translateY(-2px)}
.tile .ti{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(var(--syn-rgb),.1);
  color:var(--syn-tx);margin-bottom:4px}
.tile .ti .ic{width:18px;height:18px}
.tile h3{font-size:15px;font-weight:600}
.tile p{font-size:13px;color:var(--muted);line-height:1.5}
.tile .ir{margin-top:auto;padding-top:6px;font-family:var(--fd);font-size:11px;letter-spacing:.08em;color:var(--syn-tx);text-transform:uppercase}
.tile.fora{opacity:.62}
.tile.fora .ti{background:rgba(var(--tom),.05);color:var(--dim)}

/* o painel "Para você": dados reais da pessoa */
.vivo{margin-top:34px;border:1px solid rgba(var(--syn-rgb),.34);border-radius:20px;padding:20px 20px 22px;
  background:linear-gradient(160deg,rgba(var(--syn-rgb),.07),transparent 55%), var(--card);max-width:820px}
.vivo-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.vivo-tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--fd);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--deep);background:var(--syn);border-radius:var(--r-chip);padding:3px 10px 3px 8px;font-weight:500}
.vivo-tag .ic{width:12px;height:12px}
.vivo h2{font-size:17px;font-weight:600}
.vivo .vazio{color:var(--muted);font-size:14px}
.vivo .vz-acts{margin-top:12px}
.carregando{display:flex;align-items:center;gap:10px;color:var(--dim);font-size:13px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);border-top-color:var(--syn-borda);animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}

/* números */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:13px;padding:13px 14px;background:rgba(var(--tom),.02);display:flex;flex-direction:column;gap:2px;min-width:0}
a.stat:hover{border-color:var(--line2)}
.stat b{font-family:var(--fd);font-size:26px;font-weight:600;line-height:1.1;display:flex;align-items:center;gap:6px}
.stat b .ic{width:20px;height:20px;color:var(--warn)}
.stat span{font-size:12.5px;color:var(--muted);line-height:1.4}
.stat.alerta b{color:var(--bad-tx)}

/* listas de itens reais */
.lista{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:none}
a.li:hover .tt{color:var(--syn-tx)}
.li .pt{width:9px;height:9px;border-radius:50%;background:var(--cc,var(--dim));flex-shrink:0}
.li .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.li .tt{font-size:14px;font-weight:600;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ds{font-size:12px;color:var(--dim);font-family:var(--fm)}
.li .q{font-family:var(--fm);font-size:11.5px;color:var(--muted);white-space:nowrap}
.li .q.atraso{color:var(--bad-tx)} .li .q.hoje{color:var(--warn-tx)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--fm);font-size:10.5px;letter-spacing:.06em;
  border:1px solid var(--line2);border-radius:var(--r-chip);padding:2px 9px;color:var(--muted);white-space:nowrap}
.pill.ok{color:var(--ok-tx);border-color:rgba(var(--ok-rgb),.4);background:rgba(var(--ok-rgb),.07)}
.pill.warn{color:var(--warn-tx);border-color:rgba(var(--warn-rgb),.4);background:rgba(var(--warn-rgb),.07)}
.pill.lima{color:var(--syn-tx);border-color:rgba(var(--syn-rgb),.45);background:rgba(var(--syn-rgb),.07)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;border:1px solid var(--line2);border-radius:var(--r-chip);
  padding:4px 11px;color:var(--ink);background:rgba(var(--tom),.03)}
.chip .pf{font-family:var(--fm);font-size:10.5px;color:var(--syn-tx)}
.chip.herdado{color:var(--muted);border-style:dashed}
a.chip:hover{border-color:var(--syn-borda)}

/* avatar */
.av{position:relative;display:inline-grid;place-items:center;border-radius:50%;overflow:hidden;flex-shrink:0;
  background:rgba(var(--teal-rgb),.14);color:var(--teal-tx);font-family:var(--fm);font-weight:500;border:1px solid var(--line2)}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avs{display:flex}
.avs .av{margin-left:-7px;border:2px solid var(--panel)} .avs .av:first-child{margin-left:0}

/* o perfil */
.perfil{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.perfil .nm{font-family:var(--fd);font-size:20px;font-weight:600;line-height:1.2}
.perfil .ds{color:var(--muted);font-size:13.5px}
.perfil .chips{margin-top:8px}
.dl{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:8px 16px;margin-top:16px;font-size:14px}
.dl dt{color:var(--dim);font-family:var(--fd);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding-top:3px}
.dl dd{color:var(--ink);min-width:0}
.dl dd small{display:block;color:var(--muted);font-size:12.5px}
@media (max-width:520px){ .dl{grid-template-columns:1fr;gap:2px} .dl dd{margin-bottom:10px} }

/* a conta: o formulário de verdade */
.auth{border:1px solid var(--line2);border-radius:20px;background:var(--panel);padding:22px;max-width:540px;
  box-shadow:0 24px 70px rgba(var(--sombra-rgb),calc(.35 * var(--sombra-k)))}
.seg{display:flex;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:rgba(var(--tom),.03);margin-bottom:20px}
.seg button{flex:1;min-width:0;height:38px;border-radius:9px;font-family:var(--fd);font-size:13px;font-weight:600;color:var(--muted);padding:0 8px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.fld label{font-family:var(--fd);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fld label small{text-transform:none;letter-spacing:0;font-family:var(--f);color:var(--dim)}
.senha{position:relative}
.senha input{padding-right:46px}
.senha .ver{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:var(--dim)}
.senha .ver:hover{color:var(--ink)}
.msg{font-size:13.5px;margin-top:12px;line-height:1.5}
.msg:empty{display:none}
.msg.erro{color:var(--bad-tx)} .msg.ok{color:var(--ok-tx)}
.fina{font-size:12.5px;color:var(--dim);margin-top:14px;line-height:1.5}
.linha-passos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:720px}
.linha-passos div{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--card)}
.linha-passos b{display:block;font-family:var(--fm);font-size:11px;color:var(--syn-tx);letter-spacing:.1em;margin-bottom:4px}
.linha-passos span{font-size:13.5px;color:var(--ink)}
.linha-passos div.feito{border-color:rgba(var(--ok-rgb),.4)}
.linha-passos div.feito b{color:var(--ok-tx)}
@media (max-width:560px){ .linha-passos{grid-template-columns:1fr} }
.espera h3{font-size:19px;margin-bottom:8px}
.espera > p{color:var(--muted);font-size:14.5px}
.espera .pontos{margin:14px 0 18px}
.espera .pontos li{font-size:13.5px}

/* ============ AS ILUSTRAÇÕES ============
   Miniaturas das telas do SOMA, em HTML: acompanham o tema e não
   envelhecem como uma captura de tela. */
.mk{border:1px solid var(--line2);border-radius:18px;background:var(--panel);overflow:hidden;
  box-shadow:0 24px 70px rgba(var(--sombra-rgb),calc(.35 * var(--sombra-k)))}
.mk-cap{font-family:var(--fm);font-size:11px;color:var(--dim);margin-top:10px;letter-spacing:.04em}
.lado{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.lado.fone{grid-template-columns:minmax(0,1fr) 250px}
@media (max-width:760px){ .lado, .lado.fone{grid-template-columns:minmax(0,1fr)} }
.rola{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;scrollbar-width:thin}

/* o e-mail de confirmação */
.mk-email{background:#F4F6F5;border-radius:16px;padding:16px;color:var(--sulco-medium);max-width:420px;border:1px solid rgba(0,0,0,.06)} /* auditar: ok, tom próprio do tour */
.mk-email .me-cab{display:flex;align-items:center;gap:10px;font-size:12.5px}
.mk-email .me-cab .l{width:32px;height:32px;border-radius:50%;background:var(--cortex-primary);color:var(--paper);display:grid;place-items:center;font-weight:700;font-size:13px}
.mk-email .me-cab b{display:block;font-size:13px}
.mk-email .me-cab span{color:#6B7280;font-size:11.5px} /* auditar: ok, tom próprio do tour */
.mk-email .me-cab .qd{margin-left:auto;color:#6B7280;font-size:11px} /* auditar: ok, tom próprio do tour */
.mk-email .me-ass{font-weight:700;font-size:14px;margin:12px 0 10px}
.mk-email .me-corpo{background:var(--paper);border-radius:12px;padding:16px;border:1px solid #E5E7EB} /* auditar: ok, tom próprio do tour */
.mk-email .me-corpo p{font-size:13px;color:#374151;margin-bottom:12px} /* auditar: ok, tom próprio do tour */
.mk-email .me-bt{display:inline-block;background:var(--cortex-primary);color:var(--paper);border-radius:9px;padding:9px 16px;font-size:13px;font-weight:600;
  box-shadow:0 0 0 3px rgba(206,220,0,.8)}

/* o menu lateral */
.mk-menu{padding:14px;max-width:340px;font-size:13.5px}
.mm-topo{display:flex;align-items:center;gap:10px;padding:2px 4px 12px}
.mm-topo img{width:26px;height:26px;border-radius:7px}
.mm-topo b{font-family:var(--fd);font-size:14px;display:block;line-height:1.1}
.mm-busca{display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:11px;padding:7px 10px;color:var(--dim);margin-bottom:10px}
.mm-busca kbd{margin-left:auto}
.mm-l{list-style:none;display:flex;flex-direction:column;gap:1px}
.mm-l li{display:flex;align-items:center;gap:11px;padding:7px 8px;border-radius:9px;color:var(--ink)}
.mm-l li .ic{color:var(--muted)}
.mm-l li .fx{margin-left:auto;font-family:var(--fm);font-size:10px;color:var(--dim)}
.mm-l li.seu .fx{color:var(--ok)}
.mm-l li.fora{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(var(--ink-rgb),.25)}
.mm-l li.fora .ic{color:var(--dim)}
.mm-l li.talvez{color:var(--muted)}
.mm-div{font-family:var(--fm);font-size:9.5px;letter-spacing:.2em;color:var(--dim);padding:10px 8px 4px;display:flex;align-items:center;gap:10px}
.mm-div::after{content:'';flex:1;height:1px;background:var(--line)}
.mm-pe{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.mm-pe .ic{width:16px;height:16px}
.mm-pe .gap{margin-left:auto;display:flex;gap:10px}
.guia-nav{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.guia-nav .tile h3{display:flex;align-items:center;gap:8px}
.guia-nav .tile h3 .ic{color:var(--syn-tx)}

/* o início, em blocos numerados */
.mk-home{padding:14px;display:grid;gap:8px;grid-template-columns:1.2fr 1.2fr .9fr;
  grid-template-areas:"av av av" "pd pd pd" "tr tr tr" "se se lk" "pl ta rc"}
.mk-home > div{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:46px;position:relative;
  font-size:11.5px;color:var(--muted);background:rgba(var(--tom),.02);display:flex;align-items:flex-end}
.mk-home .n{position:absolute;top:7px;left:8px;width:20px;height:20px;border-radius:50%;background:var(--syn);color:var(--deep);
  font-family:var(--fm);font-size:10.5px;display:grid;place-items:center;font-weight:600}
.mk-home .av-b{grid-area:av;background:linear-gradient(118deg,var(--deep),var(--green) 62%,#0A6F62);color:var(--paper);min-height:60px} /* auditar: ok, tom próprio do tour */
.mk-home .pd{grid-area:pd;border-color:rgba(var(--warn-rgb),.35)}
.mk-home .trb{grid-area:tr}
.mk-home .se{grid-area:se;min-height:92px}
.mk-home .lkb{grid-area:lk}
.mk-home .pl{grid-area:pl;min-height:70px} .mk-home .ta{grid-area:ta;min-height:70px} .mk-home .rc{grid-area:rc}
.legenda{list-style:none;counter-reset:l;display:flex;flex-direction:column;gap:10px}
.legenda li{counter-increment:l;display:flex;gap:12px;color:var(--muted);font-size:14px}
.legenda li::before{content:counter(l);width:22px;height:22px;border-radius:50%;background:var(--syn);color:var(--deep);flex-shrink:0;
  font-family:var(--fm);font-size:11px;display:grid;place-items:center;font-weight:600;margin-top:1px}

/* o quadro de atividades */
.mk-kb{display:grid;grid-template-columns:repeat(5,minmax(132px,1fr));gap:8px;padding:12px;min-width:700px}
.kb-col{border:1px solid var(--line);border-radius:12px;padding:9px;background:rgba(var(--tom),.02);min-height:180px;display:flex;flex-direction:column;gap:7px}
.kb-col .h{font-family:var(--fd);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.kb-col .ex{font-size:11.5px;color:var(--muted);line-height:1.4;margin-top:auto;padding-top:8px;border-top:1px dashed var(--line)}
.kc{border:1px solid var(--line2);border-radius:10px;padding:8px 9px;background:var(--panel);position:relative;overflow:hidden;
  box-shadow:0 6px 16px rgba(var(--sombra-rgb),calc(.3 * var(--sombra-k)))}
.kc::before{content:'';position:absolute;left:10px;right:10px;top:0;height:2px;border-radius:0 0 3px 3px;background:var(--pc,var(--info));opacity:.9}
.kc.sinal::before{background:var(--warn);height:3px}
.kc.feita::before{display:none}
.kc .cd{font-family:var(--fm);font-size:9.5px;color:var(--syn-tx);display:flex;justify-content:space-between;align-items:center}
.kc .cd i{width:7px;height:7px;border-radius:50%;background:var(--pc,var(--info))}
.kc .t{font-size:11.5px;color:var(--ink);line-height:1.35;margin:4px 0 6px;font-weight:500}
.kc .r{display:flex;align-items:center;justify-content:space-between;font-family:var(--fm);font-size:9px;color:var(--dim)}
.kc .r .av{width:18px;height:18px;font-size:7.5px}
.kc .r .late{color:var(--bad-tx)}
.anat{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:26px;align-items:center}
@media (max-width:700px){ .anat{grid-template-columns:minmax(0,1fr)} }
.anat .kc{padding:14px 16px 12px;border-radius:14px}
.anat .kc::before{left:14px;right:14px;height:3px}
.anat .kc .cd{font-size:12px}
.anat .kc .cd i{width:10px;height:10px}
.anat .kc .t{font-size:15px;margin:8px 0 12px}
.anat .kc .r{font-size:11px}
.anat .kc .r .av{width:26px;height:26px;font-size:10px}
.pino{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--syn);color:var(--deep);
  font-family:var(--fm);font-size:10px;font-weight:600;margin:0 2px;vertical-align:1px;flex-shrink:0}

/* o placar */
.plc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){ .plc{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px} .plc .stat b{font-size:21px} }
.rk{list-style:none;display:flex;flex-direction:column;gap:2px}
.rk li{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:9px;font-size:13.5px;min-width:0}
.rk li.eu{background:rgba(var(--syn-rgb),.08)}
.rk li.eu .nm{color:var(--syn-tx);font-weight:600}
.rk .pos{width:18px;text-align:right;font-family:var(--fm);font-size:11px;color:var(--dim)}
.rk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .bar{width:70px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;flex-shrink:0}
.rk .bar i{display:block;height:100%;background:var(--syn)}
.rk .v{font-family:var(--fm);font-size:12px;min-width:22px;text-align:right}
.duas{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;margin-top:16px}
@media (max-width:640px){ .duas{grid-template-columns:minmax(0,1fr)} }

/* o quiosque e o celular do check-in */
.mk-ck{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;padding:20px}
.mk-quiosque{width:210px;border-radius:16px;padding:14px;background:linear-gradient(160deg,#0B1A16,var(--sulco-dark));border:1px solid rgba(255,255,255,.12); /* auditar: ok, tom próprio do tour */
  color:var(--pia-light);text-align:center}
.mk-quiosque .t{font-family:var(--fd);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--pia-primary)}
.mk-quiosque .qr{background:var(--paper);border-radius:10px;padding:8px;margin:10px auto 8px;width:132px}
.mk-quiosque .qr svg{display:block;width:100%;height:auto}
.mk-quiosque .barra{height:3px;background:rgba(255,255,255,.12);border-radius:2px;overflow:hidden;margin:0 14px 10px}
.mk-quiosque .barra i{display:block;height:100%;width:62%;background:var(--cortex-accent);animation:qrtempo 8s linear infinite}
@keyframes qrtempo{from{width:100%}to{width:0}}
.mk-quiosque .cta{font-family:var(--fd);font-size:12.5px;font-weight:600;line-height:1.3}
.mk-quiosque .s{font-size:10.5px;color:var(--pia-primary);margin-top:4px}
.seta-ck{color:var(--syn-tx)}
.seta-ck .ic{width:26px;height:26px}
.mk-fone{width:186px;border-radius:30px;padding:9px;background:#0E1311;border:1px solid rgba(255,255,255,.14); /* auditar: ok, tom próprio do tour */
  box-shadow:0 20px 50px rgba(var(--sombra-rgb),calc(.4 * var(--sombra-k)));flex-shrink:0}
.mk-fone .tela{border-radius:22px;background:var(--sulco-dark);color:var(--pia-light);min-height:330px;padding:28px 12px 14px;position:relative;overflow:hidden;
  display:flex;flex-direction:column;font-size:11.5px}
.mk-fone .tela::before{content:'';position:absolute;top:8px;left:50%;transform:translateX(-50%);width:54px;height:15px;border-radius:10px;background:var(--void)}
.mk-fone .ok-ck{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.mk-fone .ok-ck .c{width:58px;height:58px;border-radius:50%;border:2px solid var(--fn-nominal-primary);display:grid;place-items:center;background:rgba(74,222,151,.1);color:var(--fn-nominal-primary)}
.mk-fone .ok-ck .c .ic{width:28px;height:28px}
.mk-fone .ok-ck b{font-family:var(--fd);font-size:15px}
.mk-fone .ok-ck span{color:var(--pia-primary);line-height:1.45}
.mk-fone .ok-ck span b{font-size:11.5px;color:var(--pia-light)}

/* a semana da agenda */
.mk-sem{display:grid;grid-template-columns:repeat(5,minmax(110px,1fr));gap:6px;padding:12px;min-width:600px}
.sd{border:1px solid var(--line);border-radius:10px;padding:8px;min-height:150px;display:flex;flex-direction:column;gap:5px}
.sd.hoje{border-color:rgba(var(--syn-rgb),.6)}
.sd .d{font-family:var(--fm);font-size:9.5px;letter-spacing:.12em;color:var(--dim)}
.sd .d b{font-family:var(--fd);font-size:15px;color:var(--ink);letter-spacing:0;margin-left:4px}
.sd.hoje .d b{color:var(--syn-tx)}
.ev{border-left:3px solid var(--cc,var(--teal));border-radius:6px;background:rgba(var(--tom),.04);padding:4px 6px;font-size:10.5px;line-height:1.3;color:var(--ink)}
.ev .h{display:block;font-family:var(--fm);font-size:9px;color:var(--muted)}
.ev.pend{border:1px dashed var(--roxo);border-left:3px solid var(--roxo)}
.ev.dia{background:rgba(var(--info-rgb),.14)}
.mk-rsvp{padding:16px;max-width:420px}
.mk-rsvp .tp{font-family:var(--fd);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.mk-rsvp h4{font-size:16px;margin:4px 0 2px}
.mk-rsvp .q{font-size:13px;color:var(--muted)}
.mk-rsvp .bts{display:flex;gap:6px;margin-top:12px}
.mk-rsvp .bts span{border:1px solid var(--line2);border-radius:8px;padding:5px 12px;font-size:12.5px;font-family:var(--fd);font-weight:600}
.mk-rsvp .bts span.on{background:rgba(var(--tom),.12);color:var(--ink);border-color:var(--ink)}

/* treinamento e certificado */
.mk-tre{padding:16px;max-width:360px}
.mk-tre .cd{font-family:var(--fm);font-size:11px;color:var(--dim)}
.mk-tre h4{font-size:16px;margin:4px 0 4px}
.mk-tre .st{font-size:12.5px;color:var(--muted)}
.barra-p{height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin:10px 0}
.barra-p i{display:block;height:100%;background:var(--syn)}
.mk-tre .go{font-family:var(--fd);font-weight:600;font-size:13px;color:var(--syn-tx)}
.mk-cert{margin-top:12px;border-radius:12px;padding:14px;background:linear-gradient(118deg,var(--deep),var(--green) 70%);color:var(--pia-light);max-width:360px}
.mk-cert .t{font-family:var(--fd);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:rgba(232,237,235,.7)}
.mk-cert b{display:block;font-family:var(--fd);font-size:15px;margin:4px 0}
.mk-cert .c{font-family:var(--fm);font-size:11px;color:var(--cortex-accent)}

/* o Studio */
.fluxo{display:flex;align-items:stretch;gap:6px;flex-wrap:wrap}
.fluxo .f{flex:1 1 120px;border:1px solid var(--line);border-top:3px solid var(--fc);border-radius:11px;padding:10px 11px;background:var(--card);min-width:0}
.fluxo .f b{font-family:var(--fd);font-size:13.5px;display:block}
.fluxo .f span{font-size:12px;color:var(--muted);line-height:1.4;display:block;margin-top:3px}
.mk-cr{display:grid;grid-template-columns:150px minmax(0,1fr) 130px;gap:10px;padding:12px;min-width:560px}
.cr-p{border:1px solid var(--line);border-radius:10px;padding:9px;display:flex;flex-direction:column;gap:7px;font-size:11px;color:var(--muted)}
.cr-p .rt{font-family:var(--fd);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.cr-p .v{color:var(--ink);font-weight:600;font-size:12.5px}
.cr-chips{display:flex;gap:4px;flex-wrap:wrap}
.cr-chips span{border:1px solid var(--line2);border-radius:var(--r-chip);padding:1px 7px;font-size:10px}
.cr-chips span.on{background:rgba(var(--tom),.12);color:var(--ink);border-color:var(--ink)}
.cr-arte{border-radius:10px;aspect-ratio:4/5;max-height:300px;margin:0 auto;width:100%;max-width:240px;
  background:radial-gradient(120% 80% at 20% 0%,var(--cortex-primary),var(--cortex-dark) 70%);color:var(--pia-light);display:flex;flex-direction:column;
  align-items:center;justify-content:flex-end;padding:14px;text-align:center;position:relative;overflow:hidden}
.cr-arte .fr{position:absolute;top:18%;width:44%;aspect-ratio:1/1.12;border:2px solid var(--cortex-accent);border-radius:50% 50% 10px 10px;
  display:grid;place-items:center;background:rgba(255,255,255,.06)}
.cr-arte .fr img{width:58%;opacity:.8}
.cr-arte .o{font-family:var(--fm);font-size:8.5px;letter-spacing:.2em;color:var(--cortex-accent)}
.cr-arte b{font-family:var(--fd);font-size:18px;line-height:1.1;margin:3px 0}
.cr-arte .c{font-family:var(--fm);font-size:8px;letter-spacing:.14em;color:rgba(232,237,235,.75)}
.cr-arte .lg{position:absolute;top:10px;left:12px;font-family:var(--fd);font-weight:700;font-size:9.5px}
.temas{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.temas span{height:22px;border-radius:5px;border:1px solid var(--line2)}
.temas span.on{outline:2px solid var(--syn-borda);outline-offset:1px}
.acentos{display:flex;gap:5px;flex-wrap:wrap}
.acentos span{width:15px;height:15px;border-radius:50%}
.cr-topo{display:flex;align-items:center;gap:8px;padding:10px 12px 0;min-width:560px}
.cr-topo .nm{flex:1;font-family:var(--fd);font-size:13px;color:var(--dim)}
.cr-topo span.b{border:1px solid var(--line2);border-radius:8px;padding:4px 10px;font-size:11px;font-family:var(--fd);font-weight:600}
.cr-topo span.b.on{background:rgba(var(--tom),.12);color:var(--ink);border-color:var(--ink)}

/* o código de um arquivo */
.codigo{display:flex;flex-wrap:wrap;gap:4px;font-family:var(--fm);font-size:clamp(20px,4vw,30px);margin:6px 0 14px}
.codigo span{padding:6px 10px;border-radius:10px;border:1px solid var(--line2);background:var(--card);display:flex;flex-direction:column;align-items:center;gap:4px}
.codigo span small{font-family:var(--f);font-size:11px;color:var(--muted);letter-spacing:0;white-space:nowrap}
.codigo span:nth-child(2){border-color:rgba(var(--teal-rgb),.5)} .codigo span:nth-child(3){border-color:rgba(var(--syn-rgb),.5)}

/* ---------------- avatar, com a mesma cascata de fotos da casca ---------------- */
const FOTO_EXTS = ['jpg', 'jpeg', 'png', 'webp'];
function fotoErro(img){
  const i = Number(img.dataset.ext || 0) + 1, reg = img.dataset.reg;
  if (reg && i < FOTO_EXTS.length){ img.dataset.ext = i; img.src = FOTOS_BASE + reg + '.' + FOTO_EXTS[i]; }
  else img.remove();
}
function avatar(m, px = 28){
  const u = m?.foto_url || (m?.registro != null ? FOTOS_BASE + m.registro + '.jpg' : null);
  const cascata = (!m?.foto_url && m?.registro != null) ? ` data-reg="${esc(m.registro)}" data-ext="0"` : '';
  return `<span class="av" style="width:${px}px;height:${px}px;font-size:${Math.round(px * .38)}px">${esc(iniciais(m?.nome))}${
    u ? `<img src="${esc(u)}" alt="" loading="lazy"${cascata} onerror="fotoErro(this)">` : ''}</span>`;
}

/* ============================================================
   A SESSÃO E O QUE É DA PESSOA
   ============================================================ */
const sb = window.supabase ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const T = { pronto:false, sessao:null, perfil:null, membros:[], grupos:[], studioCfg:null, treCfg:null, cache:{}, missao:null };
/* um select do Supabase é "thenable": isto o torna uma promessa que nunca rejeita */
const q = b => Promise.resolve(b).then(r => r || {}, e => ({ error:e }));

async function carregarBase(){
  T.cache = {}; T.perfil = null; T.membros = []; T.grupos = []; T.studioCfg = null; T.treCfg = null;
  if (!sb){ T.sessao = null; return; }
  let s = null;
  try { s = (await sb.auth.getSession())?.data?.session || null; } catch(e){ s = null; }
  T.sessao = s;
  if (!s) return;
  const uid = s.user?.id;
  const colsG = 'id,nome,prefixo,ativo,chave,ordem,reservado';
  const [p, m, g, sc, tc] = await Promise.all([
    q(sb.from('perfis').select('id,nome,email,papel,registro').eq('id', uid).single()),
    q(sb.from('membros').select('registro,nome,cargo,departamento,status,grupos,gestor_registro,foto_url').order('nome')),
    /* com a árvore (v19), quando existe; sem ela, a lista plana */
    q(sb.from('grupos').select(colsG + ',pai_id,quadro').order('ordem').order('nome'))
      .then(r => r.error ? q(sb.from('grupos').select(colsG).order('ordem').order('nome')) : r),
    q(sb.from('studio_config').select('*').maybeSingle()),
    q(sb.from('treinamento_config').select('grupos_gestores').maybeSingle())
  ]);
  T.perfil = p.data || { id:uid, email:s.user?.email || '', papel:'leitura', registro:null };
  if (!T.perfil.email) T.perfil.email = s.user?.email || '';
  T.membros = m.data || [];
  T.grupos = (g.data || []).filter(x => x.ativo !== false);
  T.studioCfg = sc.error ? null : (sc.data || null);
  T.treCfg = tc.error ? null : (tc.data || null);
}

/* ---- quem é quem: as mesmas regras de gruposEfetivos, podeStudio… da casca ---- */
const logado = () => !!T.sessao;
const vinculado = () => !!T.perfil?.registro;
const papel = () => T.perfil?.papel || 'leitura';
const eu = () => T.membros.find(m => m.registro === T.perfil?.registro) || null;
const grupoPorNome = n => T.grupos.find(g => g.nome === n) || null;
const grupoPorId = id => T.grupos.find(g => g.id === id) || null;
function gruposAcima(g){
  const out = [], vistos = new Set();
  for (let x = g; x && !vistos.has(x.id); x = grupoPorId(x.pai_id)){ vistos.add(x.id); out.push(x); }
  return out;
}
function gruposEfetivos(m){
  const s = new Set();
  (m?.grupos || []).forEach(n => { s.add(n); gruposAcima(grupoPorNome(n)).forEach(g => s.add(g.nome)); });
  return s;
}
const meusGrupos = () => gruposEfetivos(eu());
const estouEmAlgum = ids => { const meus = meusGrupos(); return (ids || []).some(id => meus.has(grupoPorId(id)?.nome)); };
const can = () => ['admin', 'pessoal'].includes(papel());
const podeSelecao = () => ['admin', 'pessoal', 'selecao'].includes(papel());
const podeAprovarStudio = () => papel() === 'admin' || estouEmAlgum(T.studioCfg?.grupos_aprovadores);
const podeStudio = () => podeAprovarStudio() || estouEmAlgum(T.studioCfg?.grupos_acesso);
const gereTreinamentos = () => can() || estouEmAlgum(T.treCfg?.grupos_gestores);
function meusQuadros(){
  const meus = meusGrupos();
  return T.grupos.filter(g => meus.has(g.nome) && g.prefixo && g.quadro !== false)
    .sort((a, b) => (a.ordem || 0) - (b.ordem || 0) || a.nome.localeCompare(b.nome, 'pt'));
}
const PAPEIS = {
  leitura: ['Consulta', 'O papel de todo membro: tudo o que é do dia a dia.'],
  selecao: ['Comitê de Seleção', 'O dia a dia e os bastidores do processo seletivo.'],
  pessoal: ['Depto. de Pessoal', 'O dia a dia, o quadro de pessoal, os pedidos e os painéis da gestão.'],
  admin:   ['Administração', 'O sistema inteiro, com todos os painéis.']
};

/* ---- os dados de cada etapa: lidos uma vez por sessão, só quando a etapa abre ---- */
function dado(k, fn){ return (T.cache[k] ||= fn().then(v => ({ v }), erro => ({ erro }))); }
const falhou = r => { if (r.error) throw r.error; return r.data; };
const minhasTarefas = () => dado('tarefas', async () => falhou(await q(sb.from('atividades')
  .select('id,codigo,titulo,prazo,status,prioridade').eq('responsavel', T.perfil.registro).neq('status', 'concluida').limit(200))) || []);
const placar = () => dado('placar', async () => falhou(await q(sb.rpc('labbio_placar', { p_limite: 10 }))));
const agoraNoLab = () => dado('agora', async () => [...new Set((falhou(await q(sb.from('presencas').select('registro,registrado_em')
  .gte('registrado_em', new Date(Date.now() - 4 * 36e5).toISOString()).order('registrado_em', { ascending:false }).limit(100))) || [])
  .map(x => x.registro))]);
const ultimoCheckin = () => dado('ultimo', async () => (falhou(await q(sb.from('presencas').select('registrado_em')
  .eq('registro', T.perfil.registro).order('registrado_em', { ascending:false }).limit(1))) || [])[0]?.registrado_em || null);
const meusTreinos = () => dado('treinos', async () => { const d = falhou(await q(sb.rpc('treinamentos_meus'))); return Array.isArray(d) ? d : []; });
const minhaAgenda = () => dado('agenda', async () => falhou(await q(sb.rpc('agenda_itens',
  { p_de: hojeISO(), p_ate: isoDia(new Date(Date.now() + 14 * 864e5)) }))) || []);
const minhaPreferencia = () => dado('pref', async () => falhou(await q(sb.from('notificacao_preferencias')
  .select('email_modo').eq('registro', T.perfil.registro).maybeSingle()))?.email_modo || null);
const meuGoogle = () => dado('google', async () => falhou(await q(sb.from('portal_agendas')
  .select('conectado,feed_token').eq('registro', T.perfil.registro).maybeSingle())) || null);
const meusProjetos = () => dado('projetos', async () => {
  const d = falhou(await q(sb.from('projetos').select('id,codigo,nome,grupo_id,supervisor,status,logo_semente').order('nome'))) || [];
  const meus = meusGrupos();
  return d.filter(p => p.status !== 'encerrado' && meus.has(grupoPorId(p.grupo_id)?.nome));
});
const minhasPublicacoes = () => dado('pubs', async () => {
  const r = T.perfil.registro;
  return (falhou(await q(sb.from('studio_publicacoes').select('codigo,titulo,status,data_publicacao,responsavel,criado_por')
    .or(`criado_por.eq.${r},responsavel.eq.${r}`).order('data_publicacao', { ascending:true }))) || []).filter(p => p.status !== 'arquivada');
});

/* ============================================================
   OS PRIMEIROS PASSOS
   O que dá para conferir, o tour confere sozinho; o resto a
   pessoa marca. Seis itens, os mesmos na coluna e na última etapa.
   ============================================================ */
const instalado = () => emApp() || !!ler('nd.instalado', false) || !!ler('nd.tour.celular', false);
/* este navegador recebe as notificações do SOMA? (o mesmo endereço, a mesma inscrição) */
async function aparelhoRecebe(){
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || Notification.permission !== 'granted') return false;
    const reg = await navigator.serviceWorker.getRegistration(PORTAL);
    return !!(reg && await reg.pushManager.getSubscription());
  } catch(e){ return false; }
}
const MISSAO = [
  ['conta',   'Criar a sua conta',              'conta'],
  ['vinculo', 'Conta ligada ao quadro de pessoal', 'conta'],
  ['checkin', 'Fazer o primeiro check-in',       'placar'],
  ['celular', 'Pôr o SOMA na tela do celular',   'celular'],
  ['avisos',  'Escolher como receber os avisos',  'seu-soma'],
  ['treinos', 'Treinamentos obrigatórios em dia', 'treinamentos']
];
async function estadoMissao(){
  const st = { conta: logado(), vinculo: logado() && vinculado(), celular: instalado(),
               checkin: null, avisos: !!ler('nd.tour.avisos', false) || null, treinos: null };
  if (logado() && vinculado() && sb){
    const [u, pref, tr] = await Promise.all([ultimoCheckin(), minhaPreferencia(), meusTreinos()]);
    st.checkin = u.erro ? null : !!u.v;
    if (!st.avisos) st.avisos = pref.erro ? null : (!!pref.v || await aparelhoRecebe());
    st.treinos = tr.erro ? null : !tr.v.some(t => t.obrigatorio && t.situacao !== 'concluido');
  }
  return st;
}
function missaoHTML(st, grande){
  const feitos = MISSAO.filter(([k]) => st?.[k] === true).length;
  const itens = MISSAO.map(([k, rot, etapa]) => {
    const v = st?.[k];

function mudarModo(m){
  conta.modo = m;
  const a = $('#auth'); if (!a) return;

function traduzErro(e, padrao){
  const m = String(e?.message || '');
  if (/rate limit|too many|seconds|security purposes/i.test(m)) return 'Muitas tentativas em pouco tempo. Espere um minuto e tente de novo.';
  if (/password/i.test(m)) return 'A senha não foi aceita. Use pelo menos 8 caracteres, misturando letras e números.';
  if (/invalid.*email|email.*invalid|validate email/i.test(m)) return 'Endereço de e-mail inválido. Confira o que foi digitado.';
  if (/fetch|network|failed to|load failed/i.test(m)) return 'Sem conexão com o SOMA agora. Confira a internet e tente de novo.';
  return `${padrao}: ${m || 'erro inesperado'}.`;
}
async function criarConta(){
  const email = $('#c-email').value.trim().toLowerCase(), p1 = $('#c-senha').value, p2 = $('#c-senha2').value;
  const erro = t => { $('#c-erro').textContent = t; };
  if (!email || !p1) return erro('Preencha o e-mail e a senha.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return erro('Confira o e-mail: ele parece incompleto.');
  if (p1.length < 8) return erro('A senha precisa ter pelo menos 8 caracteres.');
  if (p1 !== p2) return erro('As duas senhas não conferem.');
  const bt = $('#c-btn'); bt.disabled = true; erro('');
  let r; try { r = await sb.auth.signUp({ email, password:p1, options:{ emailRedirectTo: URL_VOLTA() } }); } catch(e){ r = { error:e }; }
  bt.disabled = false;
  const { data, error } = r || {};
  const jaTem = () => { conta.email = email; conta.aviso = { tipo:'info', txt:'<b>Este e-mail já tem conta.</b> Entre com ele abaixo, ou use Esqueci a senha.' }; mudarModo('entrar'); };
  if (error) return /already|registered|exists/i.test(error.message || '') ? jaTem() : erro(traduzErro(error, 'Não foi possível criar a conta'));
  /* com a confirmação ligada, o Supabase devolve um usuário sem identities quando o e-mail já existia */
  if (data?.user && Array.isArray(data.user.identities) && data.user.identities.length === 0) return jaTem();
  if (data?.session){ await aoMudarSessao('Conta criada. Bem-vindo ao SOMA.'); return; }
  conta.email = email; conta.aviso = null;
  gravar('nd.tour.cadastro', { email, em: Date.now() });
  mudarModo('espera');
  document.querySelector('.linha-passos div')?.classList.add('feito');
}
async function entrar(){
  const email = $('#l-email').value.trim(), senha = $('#l-senha').value;
  const erro = t => { $('#l-erro').innerHTML = t; };
  if (!email || !senha) return erro('Preencha o e-mail e a senha.');
  const bt = $('#l-btn'); bt.disabled = true; erro('');
  let r; try { r = await sb.auth.signInWithPassword({ email, password: senha }); } catch(e){ r = { error:e }; }
  bt.disabled = false;
  const e = r?.error;
  if (e){
    conta.email = email;
    if (/not confirmed/i.test(e.message || '') || e.code === 'email_not_confirmed')
      return erro('Falta confirmar o e-mail. Procure a mensagem <b>Confirme o seu e-mail</b> (confira o spam) ou peça outra abaixo, em Reenviar a confirmação.');
    if (/invalid login|invalid credentials/i.test(e.message || '') || e.code === 'invalid_credentials')
      return erro('E-mail ou senha incorretos. Confira os dois. Esqueceu a senha? Use a aba <b>Esqueci a senha</b>. Ainda não tem conta? Crie a sua na primeira aba.');
    return erro(esc(traduzErro(e, 'Não foi possível entrar')));
  }
  await aoMudarSessao();
}
async function pedirSenha(){
  const email = $('#s-email').value.trim().toLowerCase(), msg = $('#s-msg');
  msg.className = 'msg';
  if (!email){ msg.classList.add('erro'); msg.textContent = 'Informe o e-mail da conta.'; return; }
  const bt = $('#s-btn'); bt.disabled = true;
  let r; try { r = await sb.auth.resetPasswordForEmail(email, { redirectTo: URL_PORTAL() }); } catch(e){ r = { error:e }; }
  bt.disabled = false;
  if (r?.error){ msg.classList.add('erro'); msg.textContent = traduzErro(r.error, 'Não foi possível enviar'); return; }
  conta.email = email;
  msg.classList.add('ok');
  msg.textContent = `Se ${email} tiver conta, o link chega em instantes (confira o spam). Abra-o neste navegador para criar a senha nova.`;
}
async function reenviar(bt){
  const email = (conta.modo === 'entrar' ? $('#l-email')?.value.trim() : conta.email) || conta.email;
  const msg = $('#e-msg'); if (!msg) return;
  msg.className = 'msg';
  if (!email){ msg.classList.add('erro'); msg.textContent = 'Digite o e-mail acima primeiro.'; return; }
  if (Date.now() < conta.espera){ msg.classList.add('erro'); msg.textContent = 'Espere um minuto antes de pedir outro e-mail.'; return; }
  if (typeof sb.auth.resend !== 'function'){ msg.classList.add('erro'); msg.textContent = 'Crie a conta de novo com o mesmo e-mail para receber outra confirmação.'; return; }
  if (bt) bt.disabled = true;
  let r; try { r = await sb.auth.resend({ type:'signup', email, options:{ emailRedirectTo: URL_VOLTA() } }); } catch(e){ r = { error:e }; }
  if (bt) bt.disabled = false;
  if (r?.error){ msg.classList.add('erro'); msg.textContent = traduzErro(r.error, 'Não foi possível reenviar'); return; }
  conta.espera = Date.now() + 60e3; conta.email = email;
  msg.classList.add('ok'); msg.textContent = `E-mail reenviado para ${email}. Confira também o spam.`;
}
function ligarConta(){
  const a = $('#auth');
  if (a && !a.dataset.ligado){
    a.dataset.ligado = '1';
    a.addEventListener('click', e => {
      const m = e.target.closest('[data-modo]');
      if (m){ if (m.hasAttribute('data-limpa')){ conta.email = ''; try { localStorage.removeItem('nd.tour.cadastro'); } catch(_){} }
        conta.aviso = null; mudarModo(m.dataset.modo); return; }
      const v = e.target.closest('[data-ver]');
      if (v){ const inp = v.parentNode.querySelector('input'); const mostra = inp.type === 'password';
        inp.type = mostra ? 'text' : 'password'; v.innerHTML = ic(mostra ? 'olho_fechado' : 'olho');
        v.setAttribute('aria-label', mostra ? 'Esconder a senha' : 'Mostrar a senha'); return; }
      if (e.target.closest('#b-reenviar, #b-reenviar-l')) reenviar(e.target.closest('button'));
    });
    a.addEventListener('submit', e => {
      e.preventDefault();
      if (e.target.id === 'f-criar') criarConta();
      else if (e.target.id === 'f-entrar') entrar();
      else if (e.target.id === 'f-senha') pedirSenha();
    });
  }
  $('#b-sair')?.addEventListener('click', async () => {
    try { await sb.auth.signOut(); } catch(e){}
    conta.modo = 'entrar'; await aoMudarSessao('Você saiu da conta neste navegador.');
  });
}

function qrFalso(){
  /* um QR de enfeite: os três quadrados de canto e um miolo sorteado, sempre o mesmo */
  const n = 21, cel = [];
  let s = 7;
  const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const canto = (x, y) => { for (let i = 0; i < 7; i++) for (let j = 0; j < 7; j++)
    if (i === 0 || i === 6 || j === 0 || j === 6 || (i > 1 && i < 5 && j > 1 && j < 5)) cel.push([x + i, y + j]); };
  canto(0, 0); canto(14, 0); canto(0, 14);
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++){
    const nosCantos = (i < 8 && j < 8) || (i > 12 && j < 8) || (i < 8 && j > 12);
    if (!nosCantos && rnd() > .52) cel.push([i, j]);
  }
  return `<svg viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges" aria-hidden="true"><rect width="${n}" height="${n}" fill="#fff"/>${ // auditar: ok, QR Code exige preto sobre branco literais
    cel.map(([x, y]) => `<rect x="${x}" y="${y}" width="1" height="1" fill="#00251f"/>`).join('')}</svg>`; // auditar: ok, QR Code exige preto sobre branco literais
}

      const sd = semDados('o seu gestor, os seus colegas e os seus projetos'); if (sd) return preencher('v-equipe', sd, vez);
      const m = eu();
      const ativo = x => ['Ativo', 'Em pausa / avaliação'].includes(x.status);
      const gestor = m?.gestor_registro != null ? T.membros.find(x => x.registro === m.gestor_registro) : null;

      const pj = await meusProjetos(); if (vez !== T.desenhoN) return;
      const projs = pj.erro ? [] : pj.v;
      const pessoa = x => `<a class="li" href="${PORTAL}#/equipe"${ALVO()}>${avatar(x, 30)}<span class="tx"><span class="tt">${esc(x.nome)}</span>

            ${liderados.length ? `<div class="sub-h">Quem responde a você</div><div class="lista">${liderados.slice(0, 5).map(pessoa).join('')}</div>` : ''}</div>
          <div><div class="sub-h" style="margin-top:0">Colegas dos seus grupos</div>
            ${colegas.length ? `<span class="avs" style="flex-wrap:wrap">${colegas.slice(0, 12).map(x => avatar(x, 32)).join('')}</span>
              <p class="vazio" style="margin-top:8px">${plural(colegas.length, 'pessoa', 'pessoas')} nos mesmos grupos que você.</p>` : '<p class="vazio">Ninguém mais nos seus grupos.</p>'}
            <div class="sub-h">Seus projetos</div>
            ${projs.length ? `<div class="chips">${projs.map(p => { const pk = /^pkm:(\d+)$/.exec(p.logo_semente || '');
                return `<a class="chip" href="${PORTAL}#/projetos/${encodeURIComponent(p.codigo)}"${ALVO()}>${pk ? `<img src="${PKM_ARTE(pk[1])}" alt="" style="width:20px;height:20px" onerror="this.remove()">` : ''}<span class="pf">${esc(p.codigo)}</span>${esc(p.nome)}</a>`; }).join('')}</div>`
              : '<p class="vazio">Você não está na equipe de nenhum projeto em andamento.</p>'}</div></div>`, vez);
    }
  };
}

  const vistas = new Set(ler('nd.tour.vistas', []));
  return ETAPAS.map((e, i) => `<li><a href="#${e.id}" class="${i === T.ix ? 'on' : ''}${vistas.has(e.id) && i !== T.ix ? ' vista' : ''}"${i === T.ix ? ' aria-current="step"' : ''}>
    <span class="n">${vistas.has(e.id) && i !== T.ix ? ic('check') : String(i + 1).padStart(2, '0')}</span><span>${esc(e.rot)}</span></a></li>`).join('');
}
function desenharCabecalho(){
  const hc = $('#hd-conta');
  if (hc){
    if (logado()){ const m = eu() || { nome:T.perfil?.nome || T.perfil?.email };
      hc.innerHTML = `${avatar(m, 24)}<span class="nm">${esc(primeiroNome(m.nome) || 'Sua conta')}</span>`;
      hc.setAttribute('aria-label', 'Sua conta: ' + (m.nome || ''));
    } else { hc.innerHTML = `${ic('key')}<span class="nm">Entrar</span>`; hc.setAttribute('aria-label', 'Criar a conta ou entrar'); }
  }
  const claro = document.documentElement.dataset.tema === 'claro';
  const bt = $('#hd-tema');
  if (bt){ bt.innerHTML = ic(claro ? 'lua' : 'sol'); bt.setAttribute('aria-label', claro ? 'Usar o tema escuro' : 'Usar o tema claro');
    bt.title = claro ? 'Tema escuro' : 'Tema claro'; }
  const cta = $('#hd-cta'); if (cta){ const alvo = ALVO(); if (alvo) cta.target = 'soma'; else cta.removeAttribute('target'); }
}
function alternarTema(){
  const claro = document.documentElement.dataset.tema !== 'claro';
  if (claro) document.documentElement.dataset.tema = 'claro'; else delete document.documentElement.dataset.tema;
  try { localStorage.setItem('nd.tema', claro ? 'claro' : 'escuro'); } catch(e){}
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content', claro ? '#F2F5F1' : '#050807'); // auditar: ok, theme-color exige valor literal
  desenharCabecalho();
}
function ir(foco){
  const id = etapaDaUrl() || ETAPAS[0].id;
  T.ix = Math.max(0, ETAPAS.findIndex(e => e.id === id));
  const e = ETAPAS[T.ix], vez = ++T.desenhoN;
  let et;
  try { et = e.desenha(); }
  catch(err){ console.error(err); et = { titulo: esc(e.rot), lead: 'Esta etapa não pôde ser montada. Recarregue a página.', corpo: '' }; }
  const ant = ETAPAS[T.ix - 1], prox = ETAPAS[T.ix + 1];
  $('#etapa').innerHTML = `<article class="et" aria-labelledby="et-h1">
      <span class="eyebrow">Etapa ${T.ix + 1} de ${ETAPAS.length}</span>
      <h1 id="et-h1" tabindex="-1">${et.titulo}</h1>
      <p class="lead">${et.lead}</p>
      ${et.corpo}
      <nav class="et-nav" aria-label="Etapas">
        ${ant ? `<a class="btn ghost" href="#${ant.id}">${ic('back')} Voltar</a>` : ''}
        <span class="dica-t">${matchMedia('(pointer: fine)').matches ? 'Setas ← → do teclado também navegam' : ''}</span>
        ${prox ? `<a class="btn solid prox" href="#${prox.id}">Continuar: ${esc(prox.rot)} ${ic('seta')}</a>`
               : `<a class="btn solid prox" href="${PORTAL}"${ALVO()}>Abrir o SOMA ${ic('seta')}</a>`}
      </nav></article>`;
  $('#pe-m').innerHTML = `${ant ? `<a class="btn ghost ant" href="#${ant.id}" aria-label="Voltar: ${esc(ant.rot)}">${ic('back')}</a>` : ''}
    ${prox ? `<a class="btn solid prox" href="#${prox.id}"><span>Continuar: ${esc(prox.rot)}</span> ${ic('seta')}</a>`
           : `<a class="btn solid prox" href="${PORTAL}">Abrir o SOMA ${ic('seta')}</a>`}`;
  document.querySelectorAll('[data-trilho]').forEach(el => el.innerHTML = trilhoHTML());
  $('#hd-n').textContent = `${T.ix + 1}/${ETAPAS.length}`;
  $('#hd-prog').style.width = `${Math.round(100 * (T.ix + 1) / ETAPAS.length)}%`;
  $('#tr-conta').textContent = `${T.ix + 1} de ${ETAPAS.length}`;
  document.title = `${e.rot} | Tour do SOMA`;
  const vistas = new Set(ler('nd.tour.vistas', [])); vistas.add(e.id); gravar('nd.tour.vistas', [...vistas]);
  if (e.id !== 'bem-vindo') gravar('nd.tour.ultima', e.id);
  if (e.id === 'ajuda' && T.missao) document.querySelectorAll('[data-missao]').forEach(el => el.innerHTML = missaoHTML(T.missao, el.dataset.missao === 'grande'));
  if (e.id === 'conta') ligarConta();
  fecharGaveta();
  if (foco !== false){
    try { window.scrollTo({ top:0, behavior:'instant' }); } catch(_){ window.scrollTo(0, 0); }
    if (foco) $('#et-h1')?.focus({ preventScroll:true });
  }
  if (et.depois) Promise.resolve().then(() => et.depois(vez)).catch(err => console.error(err));
}

/* a gaveta das etapas, no celular */
function abrirGaveta(){ const g = $('#gaveta'); g.hidden = false; $('#hd-etapas').setAttribute('aria-expanded', 'true');
  g.querySelector('a.on')?.focus(); document.body.style.overflow = 'hidden'; }
function fecharGaveta(){ const g = $('#gaveta'); if (!g || g.hidden) return; g.hidden = true;
  $('#hd-etapas').setAttribute('aria-expanded', 'false'); document.body.style.overflow = ''; }

/* ---------------- a sessão mudou (entrou, saiu, confirmou) ---------------- */
let mudando = null;
async function aoMudarSessao(aviso){
  mudando ||= (async () => {
    await carregarBase();
    try { localStorage.removeItem('nd.tour.cadastro'); } catch(e){}
    conta.aviso = null;
    desenharCabecalho();
    ir(false);
    atualizarMissao();
    if (aviso) toast(aviso);
    else if (logado()) toast(`Você entrou${primeiroNome(T.perfil?.nome) ? ', ' + primeiroNome(T.perfil.nome) : ''}. O tour agora mostra o que é seu.`);
  })().finally(() => { mudando = null; });
  return mudando;
}
async function conferirSessao(){
  if (!sb || !T.pronto || mudando) return;
  let s = null; try { s = (await sb.auth.getSession())?.data?.session || null; } catch(e){}
  if (!!s !== logado()) aoMudarSessao(s ? 'Conta confirmada. Você já está dentro.' : 'A sessão foi encerrada neste navegador.');
}

/* ---------------- os eventos da página ---------------- */
window.addEventListener('hashchange', () => { if (T.pronto) ir(true); });
document.addEventListener('click', e => {
  const c = e.target.closest('[data-copiar]'); if (c){ copiar(c.dataset.copiar); return; }
  const mk = e.target.closest('[data-marcar]'); if (mk){ gravar(mk.dataset.marcar, true); mk.remove(); atualizarMissao(); toast('Passo marcado como feito.'); return; }
  if (e.target.closest('[data-recomecar]')){ try { localStorage.removeItem('nd.tour.vistas'); localStorage.removeItem('nd.tour.ultima'); } catch(_){} }
  if (e.target.closest('[data-fecha]')) fecharGaveta();
});
$('#hd-etapas').addEventListener('click', () => $('#gaveta').hidden ? abrirGaveta() : fecharGaveta());
$('#hd-tema').addEventListener('click', alternarTema);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') fecharGaveta();
  const digitando = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName) || e.target?.isContentEditable;
  if (digitando || e.metaKey || e.ctrlKey || e.altKey || e.shiftKey || !$('#gaveta').hidden) return;
  const alvo = e.key === 'ArrowRight' ? ETAPAS[T.ix + 1] : e.key === 'ArrowLeft' ? ETAPAS[T.ix - 1] : null;
  if (alvo){ e.preventDefault(); location.hash = alvo.id; }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) conferirSessao(); });
window.addEventListener('focus', conferirSessao);

/* ---------------- a partida ---------------- */
async function boot(){
  const logo = $('#logo-hd');
  if (logo) logo.onerror = () => { const s = document.createElement('span'); s.className = 'logotype logo-img'; s.textContent = 'NeuroDynamics'; logo.replaceWith(s); };
  $('#ft-ano').textContent = new Date().getFullYear();
  desenharCabecalho();
  document.querySelectorAll('[data-missao]').forEach(el => el.innerHTML = missaoHTML(null, el.dataset.missao === 'grande'));
  if (sb){
    await carregarBase();
    if (AUTH0){
      history.replaceState(null, '', location.pathname + location.search + '#conta');
      if (logado()) setTimeout(() => toast('E-mail confirmado. Sua conta está pronta.'), 400);
    }
    /* chamadas ao Supabase de dentro do aviso travam a biblioteca: o trabalho vai para depois */
    sb.auth.onAuthStateChange(ev => {
      if (!T.pronto) return;
      if ((ev === 'SIGNED_IN' && !logado()) || (ev === 'SIGNED_OUT' && logado())) setTimeout(() => aoMudarSessao(), 0);
    });
  }
  T.pronto = true;
  desenharCabecalho();
  ir(!!etapaDaUrl());
  atualizarMissao();
}
boot();
</script>
