<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resposta ao convite, NeuroDynamics</title>
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@300;400;500;600;700&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<!--
  A resposta a um convite da agenda, pelo e-mail. Os botões Vou / Talvez /
  Não vou do e-mail trazem ?t=<token do convite>&r=<resposta>: a página
  responde na hora, sem login, por agenda_rsvp_token() — a única função da
  agenda aberta à chave anônima (migração 28.0). O token é de uma pessoa
  num evento; quem não o tem não lê nada.
-->
<style>
:root{
  --bg:#050807; --panel:#0B1210; --ink:#E8EDEB; --muted:#9AA5A1; --dim:#616C68;
  --line:rgba(232,237,235,.1); --line2:rgba(232,237,235,.18); --syn:#CEDC00; --deep:#00352F;
  --ok:#00F59B; --bad:#FF2D20; --warn:#FFAA00;
  --fd:'Archivo',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --fm:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --f:'Instrument Sans',-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;
  align-items:center;justify-content:center;padding:24px 16px;line-height:1.55;
  background-image:radial-gradient(900px 500px at 15% 0%,rgba(0,89,79,.35),transparent 60%),
    radial-gradient(700px 420px at 100% 100%,rgba(206,220,0,.08),transparent 60%)}
.cx{width:100%;max-width:480px;background:var(--panel);border:1px solid var(--line2);border-radius:20px;padding:28px}
.marca{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.marca img{width:30px;height:30px;border-radius:8px}
.marca span{font-family:var(--fd);font-weight:600;font-size:15px}
.olho{font-family:var(--fd);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);
  display:flex;align-items:center;gap:8px}
.olho::before{content:'';width:7px;height:7px;background:var(--syn)}
h1{font-family:var(--fd);font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:10px 0 14px;word-break:break-word}
h1.riscado{text-decoration:line-through;color:var(--muted)}
dl{display:grid;grid-template-columns:86px 1fr;gap:6px 12px;font-size:14px}
dt{font-family:var(--fd);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding-top:3px}
dd a{color:var(--syn)}
.pergunta{font-family:var(--fd);font-weight:600;font-size:14px;margin:22px 0 10px}
.bts{display:flex;gap:8px;flex-wrap:wrap}
.bts button{flex:1;min-width:110px;height:44px;border-radius:11px;border:1px solid var(--line2);background:rgba(255,255,255,.03);
  color:var(--ink);font:600 14px var(--fd);cursor:pointer;transition:background .15s,border-color .15s}
.bts button:hover{border-color:var(--muted)}
.bts button.on{background:rgba(232,237,235,.09);border-color:var(--line2);color:var(--ink)}
.bts button:disabled{opacity:.6;cursor:default}
.msg{margin-top:16px;font-size:13.5px;color:var(--muted);min-height:20px}
.msg.ok,.msg.err{color:var(--ink);border-left:3px solid var(--ok);padding-left:10px}.msg.err{border-color:var(--bad)}
.pe{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.pe a{color:var(--muted)}
.carregando{color:var(--muted);font-size:14px}
:focus-visible{outline:2px solid var(--syn);outline-offset:2px}
</style>
</head>
<body>
<main class="cx" id="cx">
  <div class="marca"><img src="https://brand.neurodynamics.dev/assets/icon-square-solid-white.png" alt=""><span>NeuroDynamics</span></div>
  <p class="carregando" id="carregando">Carregando o convite…</p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const CONFIG = {
  SUPABASE_URL: 'https://rxzmkyjttzzpwtodqkve.supabase.co',
  SUPABASE_ANON_KEY: 'sb_publishable_MJFR-aaQqTS1BthxYJG2kg_5XGhs9wg',
  PORTAL: 'https://membro.neurodynamics.dev/'
};
const sb = window.supabase ? supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY) : null;
const esc = v => v == null ? '' : String(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const q = new URLSearchParams(location.search);
const TOKEN = q.get('t');
const RESP = { vou:'Vou', talvez:'Talvez', nao:'Não vou' };
let ev = null;

function desenhar(msg, cls){
  const cx = document.getElementById('cx');
  const topo = `<div class="marca"><img src="https://brand.neurodynamics.dev/assets/icon-square-solid-white.png" alt=""><span>NeuroDynamics</span></div>`;
  if (!ev){ cx.innerHTML = topo + `<span class="olho">Convite</span><h1>Convite não encontrado</h1>
    <p class="msg err">${esc(msg || 'O link está incompleto ou o convite não existe mais.')}</p>`; return; }
  const cancelado = ev.status === 'cancelado';
  cx.innerHTML = topo + `<span class="olho">${cancelado ? 'Evento cancelado' : 'Convite'}</span>
    <h1 class="${cancelado ? 'riscado' : ''}">${esc(ev.titulo)}</h1>
    <dl><dt>Quando</dt><dd>${esc(ev.quando)}</dd>
      ${ev.local ? `<dt>Onde</dt><dd>${esc(ev.local)}</dd>` : ''}
      ${ev.meet_url ? `<dt>Chamada</dt><dd><a href="${esc(ev.meet_url)}" rel="noopener">${esc(ev.meet_url)}</a></dd>` : ''}
      ${ev.organizador ? `<dt>Organiza</dt><dd>${esc(ev.organizador)}</dd>` : ''}</dl>
    ${cancelado ? '' : `<p class="pergunta">${ev.nome ? esc(ev.nome) + ', você vai?' : 'Você vai?'}</p>
    <div class="bts">${Object.entries(RESP).map(([k, l]) =>
      `<button class="${ev.resposta === k ? 'on' : ''}" aria-pressed="${ev.resposta === k}" onclick="responder('${k}')">${l}</button>`).join('')}</div>`}
    <p class="msg ${cls || ''}" role="status">${esc(msg || '')}</p>
    ${ev.membro && ev.evento_id ? `<p class="pe"><a href="${CONFIG.PORTAL}#/agenda/evento/${esc(ev.evento_id)}">Abrir no portal</a></p>` : ''}`;
}

async function chamar(resposta){
  const { data, error } = await sb.rpc('agenda_rsvp_token', { p_token: TOKEN, p_resposta: resposta || null });
  if (error) throw error;
  return data;
}
async function responder(r){
  document.querySelectorAll('.bts button').forEach(b => b.disabled = true);
  try{
    const d = await chamar(r);
    if (d?.status === 'nao_encontrado'){ ev = null; return desenhar(); }
    ev = d;
    desenhar(d.status === 'cancelado' ? 'O evento foi cancelado.' : `Resposta registrada: ${RESP[d.resposta]}.`, d.status === 'cancelado' ? 'err' : 'ok');
  }catch(e){ desenhar('Não foi possível registrar agora. Tente de novo em instantes.', 'err'); }
}

(async () => {
  if (!sb || !/^[0-9a-f-]{36}$/i.test(TOKEN || '')) return desenhar();
  const r = q.get('r');
  try{
    if (RESP[r]) return await responder(r);
    const d = await chamar(null);
    if (d?.status === 'nao_encontrado') return desenhar();
    ev = d; desenhar(d.status === 'cancelado' ? 'O evento foi cancelado.' : '', d.status === 'cancelado' ? 'err' : '');
  }catch(e){ ev = null; desenhar('Não foi possível carregar o convite agora.'); }
})();
</script>
</body>
</html>
